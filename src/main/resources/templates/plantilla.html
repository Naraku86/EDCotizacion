<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragmentos :: head('Editor de plantilla')}"></head>
<body class="editor-pagina">
<header th:replace="~{fragmentos :: barra('config')}"></header>

<div class="ed-barra">
    <a class="btn chico" th:href="@{/configuracion}">← Configuración</a>
    <h1>Plantilla del PDF</h1>
    <span id="estado" class="tenue">Sin cambios</span>
    <div class="ed-acciones">
        <button id="deshacer" class="btn" title="Deshacer (Ctrl+Z)" disabled>↶ Deshacer</button>
        <button id="rehacer" class="btn" title="Rehacer (Ctrl+Y)" disabled>↷</button>
        <button id="generico" class="btn peligro" title="Reemplaza el diseño por el genérico (tus datos de empresa se conservan)">Volver a la genérica</button>
        <button id="verPdf" class="btn oscuro">Ver PDF</button>
        <button id="guardar" class="btn primario" title="Guardar (Ctrl+S)" disabled>Guardar</button>
    </div>
</div>

<div class="editor">
    <aside class="ed-paleta">
        <h2>Bloques</h2>
        <p class="tenue">Arrástralos a la hoja o haz clic para agregarlos. En la hoja, arrástralos para cambiar el orden.</p>
        <div id="paleta"></div>
    </aside>

    <section id="lienzo" class="ed-lienzo">
        <div id="hoja-host"></div>
    </section>

    <aside class="ed-panel">
        <nav class="ed-tabs">
            <button data-tab="bloque" class="activo">Bloque</button>
            <button data-tab="empresa">Empresa</button>
            <button data-tab="estilo">Colores</button>
        </nav>
        <div id="tab-bloque" class="ed-tab"></div>
        <div id="tab-empresa" class="ed-tab" hidden></div>
        <div id="tab-estilo" class="ed-tab" hidden></div>
    </aside>
</div>

<form id="formPdf" method="post" th:action="@{/configuracion/plantilla/muestra.pdf}" target="_blank" hidden>
    <input type="hidden" name="datos">
</form>

<script th:inline="javascript">
    const PLANTILLA = JSON.parse(/*[[${datosJson}]]*/ '{}');
    const GENERICO = JSON.parse(/*[[${genericoJson}]]*/ '{}');
</script>
<script th:src="@{/plantilla.js}"></script>
</body>
</html>
