<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragmentos :: head('Entrar')}"></head>
<body class="pagina-login">
<div class="tarjeta login" role="main" aria-labelledby="login-titulo">
    <div class="login-encabezado">
        <div class="logo-login"><th:block th:text="${marca.nombreParte(0)}">MI</th:block> <span th:text="${marca.nombreParte(1)}">EMPRESA</span></div>
        <p class="login-producto">Cotizaciones</p>
        <h1 id="login-titulo">Inicia sesión</h1>
        <p class="tenue">Ingresa tus datos para continuar.</p>
    </div>

    <div class="aviso error" role="alert" th:if="${param.error}">Usuario o contraseña incorrectos.</div>
    <div class="aviso error" role="alert" th:if="${param.bloqueado}">Demasiados intentos fallidos. Espera 5 minutos y vuelve a intentar.</div>
    <div class="aviso ok" role="status" th:if="${param.salio}">Cerraste sesión.</div>
    <div class="aviso ok" role="status" th:if="${param.cambio}">Datos cambiados. Entra con tu nuevo usuario y contraseña.</div>

    <form method="post" th:action="@{/login}">
        <div class="campo">
            <label for="username">Usuario</label>
            <input id="username" name="username" autocomplete="username" autofocus required>
        </div>
        <div class="campo">
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn primario">Entrar</button>
    </form>
    <p class="login-ayuda tenue" th:if="${passwordDefault}">Primera vez: usuario <b>admin</b>, contraseña <b>admin</b>.</p>
</div>
</body>
</html>
