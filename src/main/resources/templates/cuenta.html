<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragmentos :: head('Cuenta')}"></head>
<body>
<header th:replace="~{fragmentos :: barra('cuenta')}"></header>
<main id="contenido" class="pagina-cuenta">
    <h1>Usuario y contraseña</h1>

    <div class="aviso error" role="alert" th:if="${obligatorio}">
        Entraste con la contraseña de fábrica. Para usar la aplicación, primero elige una contraseña nueva.
    </div>
    <div class="aviso error" th:if="${error}" th:text="${error}"></div>

    <div class="tarjeta" th:if="${prueba?.activa}">
        <p>En la instancia de prueba todos entran con usuario <b>admin</b> y contraseña <b>admin</b>, y no se
           pueden cambiar.</p>
        <p class="tenue">Para tener tu propia cuenta, instala EDCotizacion en tu computadora.</p>
    </div>
    <form class="tarjeta" method="post" th:action="@{/cuenta}" th:unless="${prueba?.activa}">
        <div class="campo">
            <label for="nombre">Usuario</label>
            <input id="nombre" name="nombre" th:value="${usuario}" autocomplete="username" required>
        </div>
        <div class="campo">
            <label for="nuevo">Contraseña nueva (mínimo 8 caracteres)</label>
            <input id="nuevo" name="nuevo" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
        </div>
        <div class="campo">
            <label for="confirmar">Repite la contraseña nueva</label>
            <input id="confirmar" name="confirmar" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
        </div>
        <div class="campo">
            <label for="actual">Contraseña actual (para confirmar que eres tú)</label>
            <input id="actual" name="actual" type="password" autocomplete="current-password" required>
        </div>
        <div class="botonera">
            <button class="btn primario">Guardar y volver a entrar</button>
        </div>
    </form>
</main>
</body>
</html>
