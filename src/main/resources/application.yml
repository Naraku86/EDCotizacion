# Carpeta de datos: base de datos y plantilla editable del PDF
app:
  home: ${user.home}/EDCotizacion
  abrir-navegador: true
  # Demo público en /demo: sin login y sin guardar nada. false = apagado (la ruta pide sesión y no existe).
  demo:
    activo: true
    vistas-por-minuto: 90   # por IP
    pdf-por-minuto: 10      # por IP
    pdf-simultaneos: 2      # en toda la app

server:
  port: 8090
  # Solo esta computadora. Para usarla desde otras de la red: --server.address=0.0.0.0 (ver README)
  address: 127.0.0.1
  servlet:
    session:
      timeout: 12h
      cookie:
        # Nombre distinto por puerto: así dos instancias en la misma PC no se cierran la sesión entre sí
        name: EDCOT${server.port}
        http-only: true
        same-site: lax
  # la plantilla con logo viaja en un formulario ("Ver PDF"); el filtro LimiteDePeticion corta a 5 MB
  tomcat:
    max-http-form-post-size: 5MB
  # nunca mostrar trazas ni detalles internos en las páginas de error
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false

spring:
  application:
    name: edcotizacion
  datasource:
    url: jdbc:sqlite:${app.home}/cotizaciones.db?foreign_keys=true
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
  flyway:
    locations: classpath:db/migration
  jpa:
    # Flyway crea y migra las tablas; Hibernate solo las usa
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    # las consultas terminan en el servicio, no mientras se dibuja la página
    open-in-view: false
  thymeleaf:
    cache: false
